 <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>簡易POS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1b2733; --sub:#5f6f7e; --paper:#e9eef2; --card:#fff; --line:#d2dae1;
  --main:#0e6b66; --main-d:#0a514d; --done:#8a97a3; --danger:#b4361f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* タブ */
nav{display:flex;gap:6px;padding:10px 12px 0;background:var(--ink)}
nav button{flex:1;max-width:220px;padding:14px 8px;font-size:18px;font-weight:600;background:transparent;color:#a9b6c2;border-radius:10px 10px 0 0}
nav button.on{background:var(--paper);color:var(--ink)}
nav .badge{display:inline-block;min-width:24px;margin-left:6px;padding:1px 7px;border-radius:12px;background:var(--main);color:#fff;font-size:14px}
nav .badge:empty{display:none}
main{flex:1;min-height:0;display:none}
main.on{display:flex}

/* 注文ページ */
#pOrder{gap:12px;padding:12px}
#menu{flex:1;min-width:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:110px;gap:10px;align-content:start;-webkit-overflow-scrolling:touch}
.item{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;padding:12px 14px;
  background:var(--card);border-radius:12px;border:2px solid var(--line);text-align:left;transition:transform .08s}
.item:active{transform:scale(.96);border-color:var(--main)}
.item b{font-size:19px;line-height:1.25}
.item span{font-size:17px;color:var(--sub)}
.item i{position:absolute;top:-8px;right:-6px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--main);color:#fff;
  font-style:normal;font-weight:700;font-size:16px;display:none;align-items:center;justify-content:center}
.item.has{border-color:var(--main)}
.item.has i{display:flex}
#cart{width:340px;flex:none;display:flex;flex-direction:column;background:var(--card);border-radius:12px;border:2px solid var(--line);overflow:hidden}
#cart h2{margin:0;padding:12px 14px;font-size:16px;color:var(--sub);border-bottom:1px solid var(--line);font-weight:600}
#lines{flex:1;overflow-y:auto;padding:4px 10px;-webkit-overflow-scrolling:touch}
.empty{padding:28px 8px;text-align:center;color:var(--sub);font-size:16px;line-height:1.7}
.line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1;font-size:17px;line-height:1.3}
.line .sm{width:78px;text-align:right;font-size:17px}
.qty{display:flex;align-items:center;gap:2px}
.qty button{width:40px;height:40px;border-radius:10px;background:var(--paper);font-size:22px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-size:18px;font-weight:700}
#sum{padding:12px 14px;border-top:2px solid var(--ink)}
#sum .row{display:flex;justify-content:space-between;align-items:baseline}
#sum .row span{font-size:16px;color:var(--sub)}
#total{font-size:40px;font-weight:800;letter-spacing:-.5px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{height:60px;border-radius:12px;font-size:19px;font-weight:700}
#clr{flex:0 0 96px;background:var(--paper)}
#ok{flex:1;background:var(--main);color:#fff}
#ok:active{background:var(--main-d)}
#ok:disabled{background:#b6c2cb}

/* 一覧・出力 */
#pList,#pOut{flex-direction:column;padding:12px;gap:10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-radius:12px;border:2px solid var(--line)}
.bar input[type=date]{font:inherit;font-size:17px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.stat{display:flex;flex-direction:column;font-size:13px;color:var(--sub)}
.stat b{font-size:22px;color:var(--ink)}
.ord{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--card);border-radius:12px;border:2px solid var(--line)}
.ord.done{background:#f2f5f7}
.ord.done .body,.ord.done .tot{color:var(--done);text-decoration:line-through}
.chk{flex:none;width:52px;height:52px;border-radius:12px;border:3px solid var(--main);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:800}
.ord.done .chk{background:var(--main)}
.ord .body{flex:1;min-width:0}
.ord .head{font-size:14px;color:var(--sub)}
.ord .head b{font-size:20px;color:inherit;margin-right:8px}
.ord .its{margin-top:3px;font-size:17px;line-height:1.5}
.ord .tot{font-size:22px;font-weight:800}
.del{flex:none;width:44px;height:44px;border-radius:10px;background:transparent;color:var(--sub);font-size:20px}
.del:active{background:#f4d9d3;color:var(--danger)}
.big{height:64px;padding:0 22px;border-radius:12px;background:var(--main);color:#fff;font-size:18px;font-weight:700}
.big.alt{background:var(--card);color:var(--main);border:2px solid var(--main)}
.big.danger{background:var(--card);color:var(--danger);border:2px solid var(--danger);height:52px;font-size:16px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:2px solid var(--line)}
th,td{padding:12px 14px;text-align:right;font-size:17px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;color:var(--sub);font-weight:600;background:#f6f8fa}
.note{font-size:14px;color:var(--sub);line-height:1.7;padding:0 4px}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);padding:14px 22px;border-radius:12px;
  background:var(--ink);color:#fff;font-size:17px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:820px){
  #pOrder{flex-direction:column}
  #cart{width:auto;height:46%}
  #menu{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:92px}
}
</style>
</head>
<body>

<nav>
  <button id="t-order" class="on" data-t="Order">注文</button>
  <button id="t-list" data-t="List">注文一覧<span class="badge" id="pend"></span></button>
  <button id="t-out" data-t="Out">Excel出力</button>
</nav>

<main id="pOrder" class="on">
  <div id="menu"></div>
  <section id="cart">
    <h2>今の注文</h2>
    <div id="lines"></div>
    <div id="sum">
      <div class="row"><span>合計</span><div id="total" class="num">¥0</div></div>
      <div class="btns">
        <button id="clr">クリア</button>
        <button id="ok" disabled>注文を確定</button>
      </div>
    </div>
  </section>
</main>

<main id="pList">
  <div class="bar">
    <input type="date" id="vdate">
    <div class="stat"><span>注文数</span><b class="num" id="sCnt">0</b></div>
    <div class="stat"><span>売上</span><b class="num" id="sSum">¥0</b></div>
    <div class="stat"><span>未完了</span><b class="num" id="sPend">0</b></div>
  </div>
  <div id="orders"></div>
</main>

<main id="pOut">
  <div class="bar">
    <button class="big" id="exToday">今日の分をExcel出力</button>
    <button class="big alt" id="exAll">全日分をExcel出力</button>
  </div>
  <p class="note">Excelは1日につき1シート(シート名は日付)で出力されます。データはこのiPadのブラウザ内に保存されているので、営業後に出力しておくと安心です。</p>
  <table>
    <thead><tr><th>日付</th><th>注文数</th><th>売上</th></tr></thead>
    <tbody id="days"></tbody>
  </table>
  <div><button class="big danger" id="wipe">保存データをすべて削除</button></div>
</main>

<div id="toast"></div>

<script>
/* ★ メニューはここを書き換えてください */
const MENU = [
  {name:'ブレンドコーヒー', price:450},
  {name:'アイスコーヒー',   price:450},
  {name:'カフェラテ',       price:520},
  {name:'紅茶',             price:430},
  {name:'オレンジジュース', price:480},
  {name:'トースト',         price:380},
  {name:'サンドイッチ',     price:650},
  {name:'ケーキセット',     price:850},
  {name:'クッキー',         price:250},
  {name:'プリン',           price:400}
];

const KEY = 'simple_pos_orders_v1';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm  = t => { const d=new Date(t); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const yen = n => '¥'+n.toLocaleString('ja-JP');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let orders = load();
let cart = {};            // メニューindex -> 数量
let viewDate = ymd(new Date());

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(orders)); }catch(e){ toast('保存できませんでした(プライベートブラウズ中ではありませんか?)'); } }

let tt;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- タブ ---------- */
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
    document.querySelectorAll('main').forEach(m=>m.classList.toggle('on',m.id==='p'+b.dataset.t));
    if(b.dataset.t==='List') renderList();
    if(b.dataset.t==='Out') renderDays();
  };
});

/* ---------- 注文ページ ---------- */
function buildMenu(){
  $('menu').innerHTML = MENU.map((m,i)=>
    `<button class="item" data-i="${i}"><b>${esc(m.name)}</b><span class="num">${yen(m.price)}</span><i class="num"></i></button>`).join('');
  $('menu').onclick = e => {
    const b = e.target.closest('.item'); if(!b) return;
    const i = b.dataset.i; cart[i] = (cart[i]||0)+1; renderCart();
  };
}

function renderCart(){
  const keys = Object.keys(cart).filter(k=>cart[k]>0);
  let total = 0;
  $('lines').innerHTML = keys.length ? keys.map(k=>{
    const m = MENU[k], q = cart[k], s = m.price*q; total += s;
    return `<div class="line"><div class="nm">${esc(m.name)}</div>
      <div class="qty"><button data-a="-" data-i="${k}">−</button><span class="num">${q}</span><button data-a="+" data-i="${k}">＋</button></div>
      <div class="sm num">${yen(s)}</div></div>`;
  }).join('') : '<div class="empty">左のメニューをタップすると<br>ここに追加されます</div>';
  $('total').textContent = yen(total);
  $('ok').disabled = !keys.length;
  document.querySelectorAll('.item').forEach(el=>{
    const q = cart[el.dataset.i]||0;
    el.classList.toggle('has', q>0);
    el.querySelector('i').textContent = q;
  });
}

$('lines').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  const i = b.dataset.i;
  cart[i] = (cart[i]||0) + (b.dataset.a==='+' ? 1 : -1);
  if(cart[i]<=0) delete cart[i];
  renderCart();
};
$('clr').onclick = () => { cart = {}; renderCart(); };

$('ok').onclick = () => {
  const items = Object.keys(cart).filter(k=>cart[k]>0).map(k=>({name:MENU[k].name, price:MENU[k].price, qty:cart[k]}));
  if(!items.length) return;
  const now = new Date(), date = ymd(now);
  const no = orders.filter(o=>o.date===date).reduce((mx,o)=>Math.max(mx,o.no),0) + 1;
  orders.push({id:now.getTime()+'-'+no, no, date, ts:now.getTime(), items, total:items.reduce((s,it)=>s+it.price*it.qty,0), done:false});
  save(); cart = {}; renderCart(); updateBadge();
  toast('注文No.'+no+' を登録しました');
};

/* ---------- 注文一覧 ---------- */
function updateBadge(){
  const today = ymd(new Date());
  const n = orders.filter(o=>o.date===today && !o.done).length;
  $('pend').textContent = n || '';
}

function renderList(){
  $('vdate').value = viewDate;
  const list = orders.filter(o=>o.date===viewDate).sort((a,b)=>b.no-a.no);
  $('sCnt').textContent = list.length;
  $('sSum').textContent = yen(list.reduce((s,o)=>s+o.total,0));
  $('sPend').textContent = list.filter(o=>!o.done).length;
  $('orders').innerHTML = list.length ? list.map(o=>
    `<div class="ord ${o.done?'done':''}" style="margin-bottom:10px">
      <button class="chk" data-id="${o.id}" aria-label="完了">${o.done?'✓':''}</button>
      <div class="body"><div class="head"><b class="num">No.${o.no}</b><span class="num">${hm(o.ts)}</span></div>
        <div class="its">${o.items.map(it=>esc(it.name)+' ×'+it.qty).join('、')}</div></div>
      <div class="tot num">${yen(o.total)}</div>
      <button class="del" data-del="${o.id}" aria-label="削除">🗑</button>
    </div>`).join('') : '<div class="empty">この日の注文はありません</div>';
}
$('vdate').onchange = e => { if(e.target.value){ viewDate = e.target.value; renderList(); } };
$('orders').onclick = e => {
  const c = e.target.closest('.chk'), d = e.target.closest('.del');
  if(c){ const o = orders.find(x=>x.id===c.dataset.id); if(o){ o.done=!o.done; save(); renderList(); updateBadge(); } }
  if(d){ const o = orders.find(x=>x.id===d.dataset.del);
    if(o && confirm('注文No.'+o.no+' を削除しますか?')){ orders = orders.filter(x=>x!==o); save(); renderList(); updateBadge(); } }
};

/* ---------- Excel出力 (SheetJS) ---------- */
function allDates(){ return [...new Set(orders.map(o=>o.date))].sort(); }

function renderDays(){
  const ds = allDates().reverse();
  $('days').innerHTML = ds.length ? ds.map(d=>{
    const l = orders.filter(o=>o.date===d);
    return `<tr><td class="num">${d}</td><td class="num">${l.length}件</td><td class="num">${yen(l.reduce((s,o)=>s+o.total,0))}</td></tr>`;
  }).join('') : '<tr><td colspan="3" style="text-align:center;color:var(--sub)">まだデータがありません</td></tr>';
}

function sheetFor(date){
  const list = orders.filter(o=>o.date===date).sort((a,b)=>a.no-b.no);
  const rows = [['注文No','時刻','商品','単価','数量','小計','注文合計','提供済み']];
  let qty = 0, sales = 0;
  list.forEach(o=>o.items.forEach((it,i)=>{
    rows.push([o.no, hm(o.ts), it.name, it.price, it.qty, it.price*it.qty, i===0?o.total:'', o.done?'済':'']);
    qty += it.qty; sales += it.price*it.qty;
  }));
  rows.push(['合計','','','',qty,sales,'','']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:8},{wch:8},{wch:20},{wch:8},{wch:6},{wch:10},{wch:10},{wch:10}];
  return ws;
}

function exportXlsx(dates, filename){
  if(typeof XLSX === 'undefined'){ alert('Excel出力ライブラリを読み込めませんでした。ネットワークに接続して、ページを再読み込みしてください。'); return; }
  if(!dates.length){ toast('出力するデータがありません'); return; }
  const wb = XLSX.utils.book_new();
  dates.forEach(d=>XLSX.utils.book_append_sheet(wb, sheetFor(d), d));
  XLSX.writeFile(wb, filename);
  toast('Excelを出力しました');
}

$('exToday').onclick = () => {
  const t = ymd(new Date());
  exportXlsx(orders.some(o=>o.date===t) ? [t] : [], '売上_'+t+'.xlsx');
};
$('exAll').onclick = () => { const ds = allDates(); exportXlsx(ds, '売上_'+(ds[0]||'')+'_'+(ds[ds.length-1]||'')+'.xlsx'); };
$('wipe').onclick = () => {
  if(orders.length && confirm('保存されている全期間の注文データを削除します。Excel出力は済んでいますか?') && confirm('本当に削除しますか?元に戻せません。')){
    orders = []; save(); renderDays(); updateBadge(); toast('削除しました');
  }
};

buildMenu(); renderCart(); updateBadge();
</script>
</body>
</html>
